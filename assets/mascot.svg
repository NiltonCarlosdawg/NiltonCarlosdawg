      <text x="232" y="236" font-family="monospace" font-size="11" fill="#fbbf24">    'Bun','Node'],</text>
      <text x="232" y="252" font-family="monospace" font-size="11" fill="#6ee7b7">  commits: <tspan fill="#C84B1E">360</tspan>,</text>
