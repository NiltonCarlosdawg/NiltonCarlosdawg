<svg width="680" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Nilton Dev Mascot</title>
<desc>Boneco animado de um developer africano a acenar e a escrever código</desc>
<defs>
  <style>
    .float { animation: float 3.5s ease-in-out infinite; }
    .wave-arm { animation: wave 1.2s ease-in-out infinite; transform-origin: 390px 388px; }
    .blink { animation: blink 4s ease-in-out infinite; transform-origin: inherit; }
    .cursor { animation: cursor 0.8s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out 0.3s infinite; }
    .pulse2 { animation: pulse 2s ease-in-out 0.8s infinite; }
    .pulse3 { animation: pulse 2s ease-in-out 1.3s infinite; }
    .wobble { animation: wobble 2.5s ease-in-out infinite; transform-origin: 195px 392px; }
    .code-scroll { animation: codeScroll 9s linear infinite; }
    .type1 { animation: type 1.1s steps(1) infinite; }
    .type2 { animation: type 1.1s steps(1) 0.27s infinite; }
    .type3 { animation: type 1.1s steps(1) 0.54s infinite; }
    .type4 { animation: type 1.1s steps(1) 0.81s infinite; }
    .snippet1 { animation: float 4s ease-in-out 0.5s infinite; }
    .snippet2 { animation: float 3.8s ease-in-out 1.2s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes wave { 0% { transform: rotate(0deg); } 15% { transform: rotate(-28deg); } 30% { transform: rotate(10deg); } 45% { transform: rotate(-24deg); } 60% { transform: rotate(8deg); } 75% { transform: rotate(-18deg); } 100% { transform: rotate(0deg); } }
    @keyframes blink { 0%,88%,100% { transform: scaleY(1); } 93% { transform: scaleY(0.07); } }
    @keyframes cursor { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes pulse { 0%,100% { opacity:0.9; } 50% { opacity:0.2; } }
    @keyframes wobble { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes type { 0%,49% { opacity:1; } 50%,100% { opacity:0.15; } }
    @keyframes codeScroll { 0% { transform: translateY(0); } 100% { transform: translateY(-130px); } }
  </style>
  <clipPath id="sc"><rect x="222" y="152" width="236" height="148" rx="5"/></clipPath>
</defs>

<ellipse cx="340" cy="432" rx="155" ry="14" fill="#000" opacity="0.10"/>

