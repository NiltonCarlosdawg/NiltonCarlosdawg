      <text x="232" y="284" font-family="monospace" font-size="11" fill="#C84B1E">}</text>
      <text x="232" y="300" font-family="monospace" font-size="11" fill="#555">// ANGOTIC 2026</text>
      <text x="232" y="316" font-family="monospace" font-size="11" fill="#C84B1E">export default nilton</text>
      <text x="232" y="332" font-family="monospace" font-size="11" fill="#555">// built in africa</text>
      <text x="232" y="348" font-family="monospace" font-size="11" fill="#C84B1E">const nilton = {</text>
      <text x="232" y="364" font-family="monospace" font-size="11" fill="#6ee7b7">  role: <tspan fill="#fbbf24">'COO &amp; Dev'</tspan>,</text>
